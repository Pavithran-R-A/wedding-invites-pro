<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- A guest's address is `/i/<credential>`, and the page loads a stylesheet from
         fonts.googleapis.com. Browsers today default to `strict-origin-when-cross-origin`,
         which already sends only the origin — not this path — to a cross-origin HTTPS
         request; this tag is not there to fix a leak that default would otherwise cause.
         It is here to make the property explicit and ours rather than inherited from a
         browser default that a different browser, an older one, or a changed setting could
         give us. It also suppresses the referrer for same-origin requests, where that
         default sends the full path. Measured on the local stack: the fonts.googleapis.com
         request carried no `Referer` header at all.
         What this does NOT do: the credential still sits in browser history and in whatever
         access logs the hosting stack keeps. No meta tag reaches either. -->
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>VivaahVarnam — Digital Wedding Patrika</title>
    <meta
      name="description"
      content="VivaahVarnam is a South-India-first digital wedding patrika. A family signs in, writes and styles an invitation, freezes it as a version, and publishes it as a link guests read without an account. RSVP, approval workflows and printing are not part of this release."
    />
    <meta name="author" content="VivaahVarnam" />

    <meta property="og:title" content="VivaahVarnam — Digital Wedding Patrika" />
    <meta
      property="og:description"
      content="Write and style a South Indian wedding patrika, freeze it as a version, and share it as a link your guests can read without an account. RSVP, approval workflows and printing are not part of this release."
    />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="VivaahVarnam — Digital Wedding Patrika" />
    <meta
      name="twitter:description"
      content="Write and style a South Indian wedding patrika, freeze it as a version, and share it as a link your guests can read without an account. RSVP, approval workflows and printing are not part of this release."
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
