<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- A guest's address is `/i/<credential>`, and a guest page asks its own origin for the
         document, the stylesheet, the font files and the call that resolves the invitation. Under the
         browser default (`strict-origin-when-cross-origin`) a same-origin request hands over the full
         path, credential and all, as the referrer of the next request. This tag keeps that path out of
         every one of them. It is here to make the property explicit and ours rather than inherited
         from a default that a different browser, an older one, or a changed setting could give us.
         What this does NOT do: the credential still sits in browser history and in whatever access
         logs the hosting stack keeps. No meta tag reaches either. And because Stage 9 moved the faces
         behind this stylesheet, one measured detail belongs here: Chrome put
         `Referer: <this origin>/fonts/fonts.css` on all 19 font requests. A stylesheet's own
         subresources name the stylesheet, not the page that loaded it — which is the part of this
         surface that would otherwise read as the tag failing. -->
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Typography comes from this origin. The faces, their versions and their digests are recorded
         in public/fonts/font-manifest.json; scripts/check-render-assets.mjs is the gate that reads it,
         so a stylesheet here that reaches a remote font host is a build failure rather than a drift. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <title>VivaahVarnam — Digital Wedding Patrika</title>
    <meta
      name="description"
      content="VivaahVarnam is a South-India-first digital wedding patrika. A family signs in, writes and styles an invitation, freezes it as a version, and publishes it as a link guests read without an account. RSVP, approval workflows and printing are not part of this release."
    />
    <meta name="author" content="VivaahVarnam" />

    <meta property="og:title" content="VivaahVarnam — Digital Wedding Patrika" />
    <meta
      property="og:description"
      content="Write and style a South Indian wedding patrika, freeze it as a version, and share it as a link your guests can read without an account. RSVP, approval workflows and printing are not part of this release."
    />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="VivaahVarnam — Digital Wedding Patrika" />
    <meta
      name="twitter:description"
      content="Write and style a South Indian wedding patrika, freeze it as a version, and share it as a link your guests can read without an account. RSVP, approval workflows and printing are not part of this release."
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
